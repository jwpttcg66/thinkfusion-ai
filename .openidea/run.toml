# OpenIDEA 运行配置（项目级，随仓库提交）。
#
# 每个任务完成都要真机验证（见 AGENTS.md 第 9 节）；平时改代码不要每改一行就切。
# 收尾时不要从对话 shell 再起第二个 Electron 实例，Run 窗口会接管进程、
# 日志和停止动作。

[[configurations]]
id = "user:thinkfusion-dev"
name = "ThinkFusion Dev"
kind = "shell"
command = "npm"
args = ["run", "dev"]
cwd = "desktop-agent-macos"

[[configurations]]
id = "user:thinkfusion-build"
name = "ThinkFusion Build"
kind = "shell"
command = "npm"
args = ["run", "build"]
cwd = "desktop-agent-macos"
